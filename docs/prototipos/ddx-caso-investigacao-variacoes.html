<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DDX | Caso e investigação</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    :root{color-scheme:dark;font:400 14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;background:#0b0f19;color:#dce2f7}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #00f5d4;outline-offset:3px}
    .picker{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;min-height:62px;padding:9px max(18px,calc((100vw - 1180px)/2));background:#080d16;border-bottom:1px solid #283444;overflow-x:auto}
    .picker b{margin-right:auto;white-space:nowrap;color:#dce2f7}.picker button{flex:none;border:1px solid #344259;border-radius:7px;background:#141e2b;color:#c9d2e3;padding:8px 12px;font-size:12px;font-weight:700}.picker button[aria-selected=true]{background:#00f5d4;color:#00382f;border-color:#00f5d4}.picker .sep{height:20px;width:1px;background:#44516a;flex:none}
    .screen{display:none;min-height:calc(100dvh - 62px);background:#0b0f19;color:#dce2f7}.screen.active{display:block}.wrap{max-width:1180px;margin:auto;padding:18px 20px 70px}.topbar{display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid #273348;padding-bottom:12px}.back{width:36px;height:36px;border-radius:9px;background:#1a2234;color:#dce2f7;border:1px solid #33425a;font-size:22px}.topbar h1{font-size:19px;line-height:1.15;margin:0;flex:1}.topbar h1 small{display:block;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.07em;color:#00f5d4;text-transform:uppercase;margin-bottom:4px}.chip{white-space:nowrap;border-radius:999px;border:1px solid #3d7c74;background:#123831;color:#00f5d4;padding:6px 10px;font:700 11px 'JetBrains Mono',monospace}.steps{display:flex;gap:5px;overflow-x:auto;margin:15px 0 23px}.steps span{flex:1;min-width:85px;text-align:center;padding:7px 5px;border-bottom:2px solid #29374a;color:#8291ab;font:700 10px 'JetBrains Mono',monospace}.steps .done{color:#00f5d4;border-color:#00f5d4}.steps .on{color:#fff;border-color:#b49cff;background:#27203b}
    h2,h3,p{margin:0}.section-title{font-size:12px;font-weight:800;margin:22px 0 10px}.kicker{color:#00f5d4;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.muted{color:#8d9bb3}.card{background:#111827;border:1px solid #29364a;border-radius:8px;padding:17px}.patient{display:flex;align-items:center;gap:13px}.avatar{width:43px;height:43px;display:grid;place-items:center;border-radius:10px;background:#1d3b3c;border:1px solid #397d75;color:#00f5d4;font-size:19px;font-weight:800;flex:none}.patient b{display:block;font-size:16px}.patient small{display:block;color:#8d9bb3;margin-top:2px}.quote{font-size:clamp(18px,2.4vw,25px);font-weight:700;line-height:1.35}.clue-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.clue{border-left:3px solid #8b5cf6}.clue b{display:block;font-size:13px}.clue span{display:block;color:#aebbd1;font-size:12px;margin-top:5px;line-height:1.5}.primary{background:#00f5d4;border:0;color:#00382f;border-radius:8px;padding:13px 18px;font-weight:800;min-height:44px}.primary:disabled{background:#455662;color:#b5c1cb;cursor:not-allowed}.secondary{background:#1c2535;border:1px solid #475674;border-radius:8px;color:#dce2f7;padding:11px 15px;font-weight:700;min-height:44px}.action-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.note{color:#8d9bb3;font-size:11px;line-height:1.5;margin-top:10px}.accent{color:#b49cff}.pill{display:inline-flex;align-items:center;border:1px solid #47516d;border-radius:999px;color:#bca6fc;background:#211c34;padding:5px 8px;font:700 10px 'JetBrains Mono',monospace}
    .case-a{max-width:820px;margin:auto}.case-a .quote-card{margin-top:10px;padding:24px;border-color:#3e4d68}.case-a .quote-card .kicker{display:block;margin-bottom:10px}.case-b{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:16px;align-items:start}.case-b .left{display:grid;gap:10px}.case-b .quote{font-size:21px}.case-b .clue-grid{grid-template-columns:1fr}.case-b .clue{display:grid;grid-template-columns:145px 1fr;gap:10px;align-items:center}.case-b .clue span{margin:0}.case-b .right .section-title{margin-top:0}.case-b .summary{padding:15px;border:1px solid #4a4271;background:#201c31;border-radius:8px;margin-top:14px;color:#c6b8ec;font-size:12px}.case-c .banner{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;align-items:center;background:#101e29;border:1px solid #27656b;border-radius:8px;padding:24px}.case-c .quote{margin-top:10px}.case-c .patient{padding:18px;background:#0b1722;border:1px solid #294759;border-radius:8px}.case-c .context{margin-top:12px;color:#aebbd1;font-size:12px}.case-c .clue-grid{margin-top:11px}.case-c .clue{border-top:3px solid #8b5cf6;border-left:1px solid #29364a}
    .invest-a{max-width:820px;margin:auto}.tabs{display:flex;border-bottom:1px solid #344159;gap:6px;margin-bottom:14px}.tabs button{border:0;background:none;color:#9ca9bc;padding:11px 14px;border-bottom:2px solid transparent;font-weight:700}.tabs button[aria-selected=true]{color:#00f5d4;border-bottom-color:#00f5d4}.tabs em{font-style:normal;font:700 10px 'JetBrains Mono',monospace;color:#cbb8ff;margin-left:6px}.ask-list{display:grid;gap:8px}.ask{display:block;width:100%;text-align:left;border:1px solid #32415a;border-radius:8px;background:#141d2b;color:#e4eafb;padding:14px 16px;min-height:66px}.ask:hover{border-color:#7d6db1}.ask[aria-expanded=true]{border-color:#467f78;background:#142826}.ask b{display:block;font-size:13px}.ask small{display:block;color:#8d9bb3;margin-top:5px}.ask .answer{display:block;margin-top:11px;color:#b9eadc;border-top:1px solid #3b605a;padding-top:10px;font-size:12px;line-height:1.5}.invest-b{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}.invest-b .rail{display:grid;gap:9px;align-content:start}.invest-b .rail button{display:flex;align-items:center;justify-content:space-between;border:1px solid #3a4560;background:#171d2d;color:#dce2f7;padding:14px;border-radius:8px;font-weight:800;text-align:left}.invest-b .rail button.on{border-color:#8b5cf6;background:#29213c;color:#decfff}.invest-b .rail button i{font:700 11px 'JetBrains Mono',monospace;font-style:normal}.invest-b .board{background:#101826;border:1px solid #33435b;border-radius:8px;padding:18px}.invest-b .board .ask-list{grid-template-columns:repeat(2,minmax(0,1fr))}.invest-b .board .ask{min-height:120px}.invest-b .board .section-title{margin:0 0 12px}.invest-b .side-note{margin-top:12px;padding:12px;border-left:2px solid #8b5cf6;background:#1c2030;color:#b9c4d3;font-size:12px}
    .invest-c .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.invest-c .toolbar h2{font-size:18px;margin-right:auto}.invest-c .toolbar button{padding:8px 12px;border-radius:7px;background:#1b2232;border:1px solid #40516b;color:#dce2f7;font-weight:700}.invest-c .toolbar button.on{background:#153732;color:#00f5d4;border-color:#3d9b8a}.invest-c .flow{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.invest-c .records{display:grid;gap:8px}.invest-c .feed{border:1px solid #384b58;background:#101e27;border-radius:8px;padding:16px;position:sticky;top:82px;align-self:start}.invest-c .feed h3{font-size:14px}.invest-c .feed ul{margin:12px 0 0;padding-left:18px;color:#aebbd1;font-size:12px}.invest-c .feed li{margin:8px 0}.invest-c .feed .empty{color:#8d9bb3;margin-top:12px;font-size:12px}
    @media(max-width:800px){.case-b,.case-c .banner,.invest-b,.invest-c .flow{grid-template-columns:1fr}.case-b .clue-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.case-b .clue{display:block}.case-b .clue span{margin-top:5px}.invest-c .feed{position:static}.invest-b .board .ask-list{grid-template-columns:1fr}.invest-b .rail{display:flex}.invest-b .rail button{flex:1}}
    @media(max-width:600px){.picker b{display:none}.picker{padding:9px 12px}.wrap{padding:12px 14px 70px}.topbar h1{font-size:16px}.chip{font-size:10px}.clue-grid,.case-b .clue-grid{grid-template-columns:1fr}.case-c .banner{padding:16px}.case-a .quote-card{padding:18px}.action-row{display:grid}.action-row button{width:100%}.steps span{min-width:70px;font-size:9px}.invest-b .rail button{padding:10px;display:block}.invest-b .rail button i{display:block;margin-top:4px}}
  </style>
</head>
<body>
  <nav class="picker" aria-label="Escolher prévia"><b>cacoMed · DDX</b><button data-preview="case-a" aria-selected="true">3A · Ficha</button><button data-preview="case-b" aria-selected="false">3B · Painel</button><button data-preview="case-c" aria-selected="false">3C · Imersiva</button><span class="sep"></span><button data-preview="invest-a" aria-selected="false">4A · Abas</button><button data-preview="invest-b" aria-selected="false">4B · Estações</button><button data-preview="invest-c" aria-selected="false">4C · Prontuário</button></nav>
  <main id="previews"></main>
  <script>
    // Conteúdo demonstrativo do primeiro caso de src/utils/pacienteDdxConteudo.js.
    const patient={nome:'Rafael',idade:'26 anos',cenario:'Unidade Básica de Saúde, período de muitos casos no bairro',queixa:'Febre alta há 3 dias, dor atrás dos olhos e o corpo todo doendo.'};
    const clues=[['Febre alta','Febre de 39 °C há 3 dias, que cede pouco com paracetamol.'],['Dor retro-orbitária','Dor atrás dos olhos, pior ao movimentá-los.'],['Prostração','Dor no corpo e cansaço intenso, sem tosse nem coriza.']];
    const questions=[['Quantos dias de febre e como foi a curva?','Três dias, sempre alta, sem períodos sem febre.'],['Tem sangramento no nariz, gengiva ou nas fezes?','Nenhum sangramento.'],['Alguém perto de você está com o mesmo quadro?','Dois vizinhos e uma colega do curso.'],['Sente dor forte na barriga, vomita muito ou fica tonto ao levantar?','Nada disso. Só enjoo leve.'],['Tem doença crônica ou usa AAS, anticoagulante ou anti-inflamatório?','Nega doenças. Tomou só paracetamol.']];
    const exams=[['Sinais vitais','PA 118×76 mmHg sem queda ao levantar, FC 88, T 38,6 °C. Sem hipotensão postural.'],['Prova do laço','Negativa. Sem petéquias nem sangramento espontâneo.'],['Hemograma (valores ilustrativos)','Hematócrito 43%, plaquetas 168 mil, leucócitos 3.800. Sem hemoconcentração.'],['Sorologia / isolamento viral','Coletada. Resultado sai em alguns dias; não muda a conduta de hoje.']];
    const patientCard=`<div class="card patient"><span class="avatar" aria-hidden="true">R</span><span><b>${patient.nome}</b><small>${patient.idade} · ${patient.cenario}</small></span></div>`;
    const clueCards=`<div class="clue-grid">${clues.map(([a,b])=>`<div class="card clue"><b>${a}</b><span>${b}</span></div>`).join('')}</div>`;
    const header=(title,stage)=>`<header class="topbar"><button class="back" type="button" title="Prévia visual" aria-label="Voltar">‹</button><h1><small>Paciente DDX · Febre na Unidade Básica</small>${title}</h1><span class="chip">${stage}/5</span></header><div class="steps" aria-label="Etapas do atendimento"><span class="${stage==='2'?'done':'on'}">Caso</span><span class="${stage==='2'?'on':''}">Investigar</span><span>Hipótese</span><span>Conduta</span><span>Resultado</span></div>`;
    const cases={
      'case-a':`${patientCard}<section class="card quote-card"><span class="kicker">Queixa principal</span><p class="quote">“${patient.queixa}”</p></section><h2 class="section-title">O que você nota</h2>${clueCards}<div class="action-row"><button class="primary jump" data-go="invest-a">Começar a investigar →</button></div>`,
      'case-b':`<div class="left">${patientCard}<div class="card"><span class="kicker">Relato do paciente</span><p class="quote" style="margin-top:10px">“${patient.queixa}”</p></div><p class="summary">Unidade Básica · Caso 1 de 5 · Nível básico</p></div><div class="right"><h2 class="section-title">Observações iniciais</h2>${clueCards}<div class="action-row"><button class="primary jump" data-go="invest-b">Investigar este caso →</button></div></div>`,
      'case-c':`<div class="banner"><div><span class="kicker">Admissão · Atenção Primária</span><p class="quote">“${patient.queixa}”</p><p class="context">${patient.cenario}</p></div>${patientCard}</div><h2 class="section-title">Primeiras pistas</h2>${clueCards}<div class="action-row"><button class="primary jump" data-go="invest-c">Abrir investigação →</button></div>`
    };
    const askList=items=>`<div class="ask-list">${items.map(([q,r],i)=>`<button class="ask" type="button" data-answer="${i}" aria-expanded="false"><b>${q}</b><small>${items===questions?'Toque para perguntar':'Toque para solicitar'}</small><span class="answer" hidden>${r}</span></button>`).join('')}</div>`;
    const tabbar=`<div class="tabs" role="tablist"><button role="tab" data-tab="questions" aria-selected="true">Perguntas <em data-count="questions">0/5</em></button><button role="tab" data-tab="exams" aria-selected="false">Exames <em data-count="exams">0/4</em></button></div>`;
    const invest={
      'invest-a':`${tabbar}<div data-panel="questions">${askList(questions)}</div><div data-panel="exams" hidden>${askList(exams)}</div><p class="note">Pergunte e solicite exames para reunir as informações do caso.</p><div class="action-row"><button class="secondary jump" data-go="case-a">Voltar ao caso</button><button class="primary" title="Prévia visual: hipótese não implementada">Fechar hipótese →</button></div>`,
      'invest-b':`<div class="rail"><button data-tab="questions" class="on">Perguntas <i data-count="questions">0/5</i></button><button data-tab="exams">Exames <i data-count="exams">0/4</i></button></div><div class="board"><h2 class="section-title">Investigação clínica</h2><div data-panel="questions">${askList(questions)}</div><div data-panel="exams" hidden>${askList(exams)}</div><div class="side-note">As respostas aparecem no próprio item solicitado.</div><div class="action-row"><button class="secondary jump" data-go="case-b">Voltar ao caso</button><button class="primary" title="Prévia visual: hipótese não implementada">Fechar hipótese →</button></div></div>`,
      'invest-c':`<div class="toolbar"><h2>Investigue o caso</h2><button data-tab="questions" class="on">Perguntas <span data-count="questions">0/5</span></button><button data-tab="exams">Exames <span data-count="exams">0/4</span></button></div><div class="flow"><div class="records"><div data-panel="questions">${askList(questions)}</div><div data-panel="exams" hidden>${askList(exams)}</div><div class="action-row"><button class="secondary jump" data-go="case-c">Voltar ao caso</button><button class="primary" title="Prévia visual: hipótese não implementada">Fechar hipótese →</button></div></div><aside class="feed"><span class="kicker">Prontuário</span><h3>Informações reunidas</h3><p class="empty">Toque em uma pergunta ou exame para registrar a resposta aqui.</p><ul></ul></aside></div>`
    };
    const ids=['case-a','case-b','case-c','invest-a','invest-b','invest-c'];
    document.getElementById('previews').innerHTML=ids.map((id,i)=>`<section class="screen ${i===0?'active':''}" id="${id}" aria-label="Variação ${id}"><div class="wrap">${header(id.startsWith('case')?'Caso 1 · Básico':'Investigação',id.startsWith('case')?'1':'2')}<div class="${id}">${cases[id]||invest[id]}</div></div></section>`).join('');
    const seen={};
    function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-preview]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.preview===id)));}
    document.addEventListener('click',e=>{
      const picker=e.target.closest('[data-preview],.jump');if(picker){show(picker.dataset.preview||picker.dataset.go);return;}
      const tab=e.target.closest('[data-tab]');if(tab){const screen=tab.closest('.screen');screen.querySelectorAll('[data-tab]').forEach(x=>{const active=x.dataset.tab===tab.dataset.tab;x.setAttribute('aria-selected',String(active));x.classList.toggle('on',active)});screen.querySelectorAll('[data-panel]').forEach(x=>x.hidden=x.dataset.panel!==tab.dataset.tab);return;}
      const ask=e.target.closest('.ask');if(ask&&!ask.classList.contains('opened')){ask.classList.add('opened');ask.setAttribute('aria-expanded','true');ask.querySelector('.answer').hidden=false;ask.querySelector('small').hidden=true;const screen=ask.closest('.screen'),type=ask.closest('[data-panel]').dataset.panel;seen[screen.id]??={questions:new Set(),exams:new Set()};seen[screen.id][type].add(ask.dataset.answer);screen.querySelectorAll(`[data-count="${type}"]`).forEach(x=>x.textContent=`${seen[screen.id][type].size}/${type==='questions'?5:4}`);const feed=screen.querySelector('.feed');if(feed){feed.querySelector('.empty').hidden=true;const item=document.createElement('li');item.textContent=ask.querySelector('b').textContent+' — '+ask.querySelector('.answer').textContent;feed.querySelector('ul').append(item)}}
    });
  </script>
</body>
</html>
