<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DDX | Variações da seleção</title>
  <style>
    :root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#e9eef1;background:#090d12;font-size:14px}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #53dbc4;outline-offset:3px}
    .switcher{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px max(18px,calc((100vw - 1180px)/2));background:#080c11;border-bottom:1px solid #263039;min-height:62px}
    .switcher strong{font-size:13px;margin-right:auto}.switcher button{color:#9caab2;background:none;border:1px solid #2c3940;padding:9px 13px;border-radius:6px;white-space:nowrap}
    .switcher button[aria-selected="true"]{color:#09221d;background:#63ddc4;border-color:#63ddc4;font-weight:700}.switcher .num{opacity:.55;margin-right:5px}
    .screen{--bg:#0e1519;--panel:#182229;--line:#2b3940;--text:#e9eef1;--muted:#9cabb3;--accent:#61d9c1;--accentText:#09231e;background:var(--bg);color:var(--text);min-height:calc(100dvh - 62px);display:none}
    .screen.active{display:block}.inner{max-width:1180px;margin:auto;padding:26px 26px 50px}.top{display:flex;align-items:center;gap:14px;margin-bottom:24px}.back{height:38px;width:38px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;font-size:22px;line-height:1}
    .brand{font-weight:800;font-size:20px}.brand em{font-style:normal;color:var(--accent)}.top .spacer{flex:1}.balance{display:inline-flex;align-items:center;gap:7px;color:#ffcc71;font-weight:700;border:1px solid #745b32;background:#2e291f;padding:8px 10px;border-radius:6px}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(26px,4vw,43px);line-height:1.1;letter-spacing:0;margin:8px 0 10px}h2,h3,p{margin:0}.lede{color:var(--muted);line-height:1.5;max-width:62ch}.pill{font-size:11px;font-weight:700;padding:5px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.pill.live{border-color:#3e927d;color:#77e3c9}.pill.pilot{border-color:#6c6089;color:#c9b8f3}.pill.warn{border-color:#786037;color:#ffd37d}
    .monitor{border:1px solid var(--line);background:#121d21;padding:17px 20px}.monitor-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.monitor strong{font-size:16px}.monitor small{display:block;color:var(--muted);margin-top:4px}.vitals{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.vital{flex:1;min-width:74px;border-left:2px solid #486c69;padding-left:10px}.vital span{display:block;font:700 10px ui-monospace,monospace;color:var(--muted)}.vital b{display:block;font:700 20px ui-monospace,monospace;margin-top:2px}.vital:nth-child(3) b{color:var(--accent)}.trace{width:100%;height:36px;margin-top:14px}.trace path{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
    .mode{background:var(--panel);border:1px solid var(--line);padding:18px;min-width:0}.mode .meta{display:flex;justify-content:space-between;align-items:start;gap:10px}.mode .icon{display:grid;place-items:center;width:39px;height:39px;border:1px solid var(--line);color:var(--accent);font-size:20px;flex:none}.mode h3{font-size:17px;margin:14px 0 6px}.mode p{line-height:1.45;color:var(--muted);min-height:42px}.mode-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.mode-foot small{color:var(--muted);line-height:1.3}.mode button,.action{border:0;color:var(--accentText);background:var(--accent);border-radius:5px;font-weight:800;padding:10px 13px;white-space:nowrap}.mode button:disabled{background:#405057;color:#b8c3c6;cursor:not-allowed}.mode .resume{background:#d5c2ff;color:#221a32}.other-title{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:26px 0 10px}.pilots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pilot{display:flex;gap:10px;align-items:center;padding:14px;border:1px dashed #625878;background:#211e2c;color:#eee7ff;text-align:left;border-radius:5px}.pilot span{flex:1;min-width:0}.pilot b{display:block}.pilot small{color:#b7acc8;display:block;margin-top:3px}.pilot i{font-style:normal;color:#d9c6ff}
    .a{--bg:#f2f5f4;--panel:#fff;--line:#cdd9d6;--text:#17302e;--muted:#526a68;--accent:#087f6c;--accentText:#fff}.a .top .back{background:#fff}.a .balance{background:#fff9e8;color:#78560c;border-color:#ebd79b}.a .pill{background:#f7faf9}.a .monitor{background:#e8f1ee}.a .pilot{background:#f7f4fc;color:#393147;border-color:#bcaed0}.a .pilot small{color:#6f6579}.a .pilot i{color:#69518c}
    .a .intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:16px 0 22px}.a .intro aside{color:#46645d;border-left:3px solid #a5c7bb;padding:6px 0 6px 12px;max-width:250px;font-size:12px}.a .body-grid{display:grid;grid-template-columns:310px 1fr;gap:18px}.a .mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.a .mode{display:flex;flex-direction:column}.a .mode p{flex:1}.a .mode-foot{display:block}.a .mode-foot button{width:100%;margin-top:12px}.a .monitor .trace{opacity:.7}
    .b{--bg:#0b1119;--panel:#151f2b;--line:#304452;--text:#eff5f8;--muted:#a0b1bd;--accent:#79dce8;--accentText:#08292c}.b .intro{margin:16px 0 22px}.b .body-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:18px}.b .monitor{min-height:410px;background:#0d1b25;border-color:#477d88;display:flex;flex-direction:column;justify-content:space-between;padding:24px}.b .monitor strong{font-size:22px}.b .monitor .trace{height:98px;margin-top:30px}.b .vital b{font-size:25px}.b .mode-grid{display:grid;gap:9px}.b .mode{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px 16px}.b .mode .meta{display:contents}.b .mode .icon{grid-column:1;grid-row:1/3}.b .mode .pill{grid-column:3;grid-row:1}.b .mode h3{grid-column:2;grid-row:1;margin:0}.b .mode p{grid-column:2;grid-row:2;min-height:0;font-size:12px}.b .mode-foot{grid-column:3;grid-row:2;margin:0;flex-direction:column;align-items:end}.b .mode-foot small{display:none}.b .pilots{margin-top:12px}
    .c{--bg:#111116;--panel:#1d2027;--line:#434650;--text:#f1f1f0;--muted:#aaacb4;--accent:#f6bd61;--accentText:#30200b}.c .top{border-bottom:1px solid var(--line);padding-bottom:18px}.c .intro{margin:16px 0 25px}.c .body-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px}.c .mode-grid{display:grid;gap:12px}.c .mode{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;border-left:3px solid var(--accent)}.c .mode .meta{display:contents}.c .mode .icon{grid-column:1;grid-row:1/3}.c .mode .pill{grid-column:3;grid-row:1}.c .mode h3{grid-column:2;grid-row:1;margin:0}.c .mode p{grid-column:2;grid-row:2;min-height:0}.c .mode-foot{grid-column:3;grid-row:2;margin:0;flex-direction:column;align-items:end}.c .mode-foot small{display:none}.c .monitor{background:#1b2226;grid-column:2;grid-row:1}.c .vitals{display:grid;grid-template-columns:1fr 1fr}.c .vital{min-width:0}.c .pilots{grid-template-columns:1fr}.c .pilot{background:#29252f}
    .context{padding:16px;border:1px solid var(--line);color:var(--muted);line-height:1.45;margin-top:12px;font-size:12px}.context b{color:var(--text)}
    @media(max-width:900px){.a .body-grid,.b .body-grid,.c .body-grid{grid-template-columns:1fr}.a .mode-grid{grid-template-columns:1fr}.b .monitor{min-height:240px}.c .monitor{grid-column:1;grid-row:1}.c .mode-grid{grid-row:2}}
    @media(max-width:620px){.switcher{overflow-x:auto;padding:9px 12px}.switcher strong{display:none}.switcher button{flex:none}.inner{padding:17px 15px 38px}.a .intro aside{display:none}.top{margin-bottom:18px}.b .mode,.c .mode{grid-template-columns:38px 1fr;padding:14px}.b .mode .pill,.c .mode .pill{grid-column:2;grid-row:3;justify-self:start}.b .mode h3,.c .mode h3{grid-column:2}.b .mode p,.c .mode p{grid-column:2}.b .mode-foot,.c .mode-foot{grid-column:1/-1;grid-row:4;align-items:stretch}.b .mode-foot button,.c .mode-foot button{width:100%}.pilots{grid-template-columns:1fr}.monitor{padding:16px}.monitor-head{align-items:start}.monitor .pill{white-space:normal}.vital b{font-size:18px!important}}
  </style>
</head>
<body>
  <nav class="switcher" aria-label="Variações da tela"><strong>DDX · seleção de modos</strong><button type="button" data-show="a" aria-selected="true"><span class="num">01</span>Clínica</button><button type="button" data-show="b" aria-selected="false"><span class="num">02</span>Monitor</button><button type="button" data-show="c" aria-selected="false"><span class="num">03</span>Trilhas</button></nav>
  <main id="previews"></main>
  <script>
    const modes=[
      {icon:'✚',name:'Plantão médico',desc:'Investigue, acompanhe a paciente e escolha a conduta.',rule:'Até 250 XP',state:'Em andamento',button:'Retomar',resume:true},
      {icon:'▤',name:'Erro médico',desc:'Audite o atendimento e identifique a decisão crítica.',rule:'4 etapas · até 100 XP',state:'Disponível',button:'Iniciar · 1 ticket'},
      {icon:'◇',name:'Causa e efeito',desc:'Reconstrua a cadeia fisiológica e a intervenção.',rule:'4 etapas · até 100 XP',state:'Em revisão clínica',button:'Em revisão clínica',disabled:true}
    ];
    const monitor=`<section class="monitor" aria-label="Paciente do caso"><div><div class="monitor-head"><div><strong>Paciente em observação</strong><small>Dispneia e chiado após exposição a poeira</small></div><span class="pill live">CASO RESPIRATÓRIO</span></div><div class="vitals"><div class="vital"><span>FC</span><b>112</b></div><div class="vital"><span>FR</span><b>28</b></div><div class="vital"><span>SpO₂</span><b>92%</b></div><div class="vital"><span>PA</span><b>128/78</b></div></div></div><svg class="trace" viewBox="0 0 560 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 47H82l10-8 8 8h17l12-33 13 57 15-24 9 0 11-8 10 8h126l10-8 8 8h17l12-33 13 57 15-24 9 0 11-8 10 8h126"/></svg></section>`;
    const mode=m=>`<article class="mode"><div class="meta"><span class="icon" aria-hidden="true">${m.icon}</span><span class="pill ${m.disabled?'warn':m.resume?'live':''}">${m.state}</span></div><h3>${m.name}</h3><p>${m.desc}</p><div class="mode-foot"><small>${m.rule}${m.resume?' · sem novo ticket':''}</small><button type="button" ${m.disabled?'disabled':''} ${m.resume?'class="resume"':''} title="Prévia visual: nenhuma partida será iniciada">${m.button}</button></div></article>`;
    const pilots=`<h2 class="other-title">Outras experiências · piloto do administrador</h2><div class="pilots"><button type="button" class="pilot" title="Prévia visual"><i>⚔</i><span><b>Batalha diagnóstica</b><small>Duelo por turnos</small></span><i>›</i></button><button type="button" class="pilot" title="Prévia visual"><i>◎</i><span><b>Paciente DDX</b><small>17 casos em consulta</small></span><i>›</i></button></div>`;
    const titles={a:['Clínica','Escolha seu atendimento','Um quadro, três maneiras de exercitar o raciocínio clínico.'],b:['Monitor','Paciente em observação','Acompanhe os sinais e escolha como abordar o mesmo caso.'],c:['Trilhas','Rotas de diagnóstico','Continue o plantão ou abra outra perspectiva do caso.']};
    document.getElementById('previews').innerHTML=['a','b','c'].map((key,i)=>{const [label,title,desc]=titles[key];return `<section class="screen ${key} ${i===0?'active':''}" id="variant-${key}" aria-label="Variação ${i+1}: ${label}"><div class="inner"><header class="top"><button class="back" type="button" aria-label="Voltar ao menu" title="Prévia visual">‹</button><span class="brand">caco<em>Med</em></span><span class="spacer"></span><span class="balance" title="Saldo de demonstração">◇ 3 tickets</span></header><div class="intro"><div><span class="eyebrow">DDX · Seleção de modos / ${String(i+1).padStart(2,'0')}</span><h1>${title}</h1><p class="lede">${desc}</p></div>${key==='a'?'<aside>Uma paciente, três modos. Retomar uma partida não consome outro ticket.</aside>':''}</div><div class="body-grid">${key==='c'?`<div><div class="mode-grid">${modes.map(mode).join('')}</div>${pilots}</div>${monitor}`:`${monitor}<div><div class="mode-grid">${modes.map(mode).join('')}</div>${pilots}</div>`}</div>${key==='c'?'<p class="context"><b>Progresso do caso:</b> Plantão em andamento · Erro médico disponível · Causa e efeito aguardando revisão.</p>':''}</div></section>`}).join('');
    document.querySelectorAll('[data-show]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-show]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));
      document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===`variant-${button.dataset.show}`));
    }));
  </script>
</body>
</html>
